<body class="bg-gradient-to-b from-primary-fixed to-surface-container-lowest text-on-surface min-h-screen flex flex-col items-center justify-center font-sans antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Container -->
<main class="w-full max-w-[375px] mx-auto px-margin-mobile py-xl flex flex-col min-h-screen relative animate-fade-in">
<!-- Top Section: Logo & Branding -->

<div class="w-[120px] h-[120px] mb-lg flex items-center justify-center">
<img alt="VIT University Logo" class="w-full h-full object-contain mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBaaux1V9rKn3ycy3ssPoye-QBBQ0kw3mx064aO-Es5fgNc01y4XLQ_ANanBWGk86x6O3RT5ZY6p_9zhHTxmIwtl5pZnFc2jPLFwPodtO49qLnfg-3LqEiNQZ2zxWRE5GbFR5PSMcwmH_5x40J3EMqT533sxLGAI3RgL1ulAFoQ1xFWDc1ck1_t6VBKmHe9CkST24K9ASurJxT0dBTTDn6CgPUjBQG7z8uQADpeIzvOVGXBt-c_tfduQl_aBWXcujYt09fDFW3g"/>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight text-center">VIT Library</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs text-center">Sign in to manage your seat reservations.</p>
</div>
<!-- Login Form Card -->
<div class="bg-surface-container-lowest border border-[#E0E0E0] rounded-[12px] shadow-[4px_4px_0px_0px_#1c1b1b] p-md w-full">
<form class="flex flex-col gap-md">
<!-- Username Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="username">Registration Number</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="material-symbols-outlined absolute left-sm text-outline w-5 h-5 flex items-center justify-center pointer-events-none" data-icon="badge">badge</span>
<input class="w-full h-12 pl-[44px] pr-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-lg text-body-lg focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none" id="username" name="username" placeholder="e.g. 21BCE0000" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="material-symbols-outlined absolute left-sm text-outline w-5 h-5 flex items-center justify-center pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-12 pl-[44px] pr-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-lg text-body-lg focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm text-outline hover:text-on-surface transition-colors w-6 h-6 flex items-center justify-center rounded-full focus:outline-none focus:ring-2 focus:ring-primary-container/50" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-xs">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors focus:outline-none focus:underline" href="#">Forgot Password?</a>
</div>
</div>
<!-- Login Button -->
<button class="w-full h-12 mt-xs rounded-full bg-primary-container text-white font-headline-md text-headline-md flex items-center justify-center gap-xs hover:bg-primary transition-all active:translate-y-[2px] active:shadow-[0px_0px_0px_0px_#1c1b1b] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container shadow-[4px_4px_0px_0px_#1c1b1b] border border-on-surface" type="submit">
                Login
                <span class="material-symbols-outlined text-[24px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer / Support -->

<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="help">help</span>
                Need help? <a class="text-primary font-label-lg hover:underline" href="#">Contact Support</a>
</p>

<script>
        // Simple password toggle interaction
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');

            if (toggleBtn && passwordInput && toggleIcon) {
                toggleBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    toggleIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
                    toggleIcon.setAttribute('data-icon', isPassword ? 'visibility' : 'visibility_off');
                });
            }
        });
    </script>
