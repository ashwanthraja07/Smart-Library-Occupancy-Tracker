<style>
  * { box-sizing: border-box; }
  body {
    -webkit-tap-highlight-color: transparent;
    margin: 0;
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .filled-icon {
    font-variation-settings: 'FILL' 1;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fadeIn 0.4s ease-out forwards;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Seat button styles */
  .seat-btn {
    transition: transform 0.1s ease-in-out, box-shadow 0.2s ease;
  }
  .seat-btn:active { transform: scale(0.9); }

  /* Scrollbar */
  .seat-grid-container::-webkit-scrollbar { width: 6px; height: 6px; }
  .seat-grid-container::-webkit-scrollbar-track { background: transparent; }
  .seat-grid-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }
  
  /* Dark mode scrollbar support */
  .dark .seat-grid-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased min-h-screen flex flex-col font-body-md transition-colors duration-300">
