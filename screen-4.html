<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>VIT Library - Floor Selector</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "on-surface": "#1c1b1b",
                            "outline-variant": "#cfc2d1",
                            "primary-fixed-dim": "#e4b5ff",
                            "on-secondary-fixed": "#281800",
                            "on-error-container": "#93000a",
                            "primary": "#2e004b",
                            "on-secondary-container": "#6b4800",
                            "on-tertiary-fixed": "#00210c",
                            "tertiary-fixed-dim": "#4ae183",
                            "tertiary-container": "#003819",
                            "background": "#fcf9f8",
                            "on-background": "#1c1b1b",
                            "surface-container-highest": "#e5e2e1",
                            "primary-container": "#4a0e6f",
                            "surface-variant": "#e5e2e1",
                            "secondary-fixed": "#ffddaf",
                            "surface-container-lowest": "#ffffff",
                            "on-secondary-fixed-variant": "#614000",
                            "secondary-container": "#ffb21d",
                            "surface-container": "#f0eded",
                            "on-tertiary-fixed-variant": "#005228",
                            "on-secondary": "#ffffff",
                            "primary-fixed": "#f4daff",
                            "surface-container-high": "#eae7e7",
                            "surface-bright": "#fcf9f8",
                            "on-tertiary-container": "#00ae5b",
                            "inverse-surface": "#313030",
                            "surface-tint": "#7d45a2",
                            "tertiary": "#00200c",
                            "on-primary-fixed": "#2f004c",
                            "on-tertiary": "#ffffff",
                            "inverse-primary": "#e4b5ff",
                            "error": "#ba1a1a",
                            "tertiary-fixed": "#6bfe9c",
                            "on-primary": "#ffffff",
                            "error-container": "#ffdad6",
                            "surface-dim": "#dcd9d9",
                            "on-primary-fixed-variant": "#632c88",
                            "on-error": "#ffffff",
                            "secondary": "#805600",
                            "inverse-on-surface": "#f3f0ef",
                            "surface": "#fcf9f8",
                            "secondary-fixed-dim": "#ffba44",
                            "outline": "#7e7481",
                            "surface-container-low": "#f6f3f2",
                            "on-primary-container": "#ba7fe0",
                            "on-surface-variant": "#4c4450",
                            "neo-bg": "#F5F5F5",
                            "neo-border": "#E0E0E0",
                            "neo-gold": "#F0A500"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "xl": "80px",
                            "base": "4px",
                            "sm": "12px",
                            "margin-desktop": "64px",
                            "xs": "8px",
                            "gutter": "24px",
                            "lg": "48px",
                            "margin-mobile": "16px",
                            "md": "24px",
                            "container-padding": "16px"
                    },
                    "fontFamily": {
                            "headline-lg": ["Space Grotesk"],
                            "label-lg": ["Outfit"],
                            "headline-lg-mobile": ["Space Grotesk"],
                            "headline-md": ["Space Grotesk"],
                            "body-lg": ["Outfit"],
                            "body-md": ["Outfit"],
                            "label-sm": ["Outfit"],
                            "display": ["Space Grotesk"]
                    },
                    "fontSize": {
                            "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "700"}],
                            "label-lg": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500"}],
                            "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "700"}],
                            "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "0.02em", "fontWeight": "600"}],
                            "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0.03em", "fontWeight": "300"}],
                            "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0.03em", "fontWeight": "300"}],
                            "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500"}],
                            "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-sans max-w-[375px] mx-auto relative pb-[80px]">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-gradient-to-r from-primary-fixed to-surface shadow-[0_2px_0_rgba(0,0,0,1)] border-b-2 border-black">
<div class="flex items-center justify-between px-container-padding py-sm w-full max-w-[768px] mx-auto">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-[24px]">school</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">VIT Library</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-black/5 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined font-bold">search</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full px-container-padding py-lg flex flex-col gap-lg overflow-y-auto bg-surface">
<div class="flex flex-col gap-xs border-b-2 border-black pb-4 mb-2">
<h2 class="font-display text-[40px] leading-tight text-on-surface tracking-widest uppercase">Library Floors</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant font-medium tracking-wider">Select a floor to view available seats.</p>
</div>
<!-- Floor List -->
<div class="flex flex-col gap-md">
<!-- Ground Floor Card -->
<div class="bg-neo-bg rounded-[12px] p-md shadow-[4px_4px_0px_rgba(0,0,0,1)] border-[1px] border-neo-border flex flex-col gap-sm cursor-pointer hover:-translate-y-1 hover:shadow-[6px_6px_0px_rgba(0,0,0,1)] transition-all active:scale-[0.98] duration-150 group">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<h3 class="font-headline-md text-headline-md text-on-surface tracking-widest uppercase">Ground Floor</h3>
<span class="font-body-md text-body-md text-on-surface-variant tracking-wider font-medium">Reference &amp; Quiet Study</span>
</div>
<div class="bg-black text-white px-sm py-xs rounded-full flex items-center gap-xs border-2 border-black">
<span class="font-label-lg text-label-lg font-bold tracking-widest">67% occupied</span>
</div>
</div>
<div class="w-full bg-white rounded-full h-[8px] mt-sm border-2 border-black overflow-hidden">
<div class="bg-neo-gold h-full rounded-full" style="width: 67%"></div>
</div>
</div>
<!-- First Floor Card -->
<div class="bg-neo-bg rounded-[12px] p-md shadow-[4px_4px_0px_rgba(0,0,0,1)] border-[1px] border-neo-border flex flex-col gap-sm cursor-pointer hover:-translate-y-1 hover:shadow-[6px_6px_0px_rgba(0,0,0,1)] transition-all active:scale-[0.98] duration-150 group">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<h3 class="font-headline-md text-headline-md text-on-surface tracking-widest uppercase">First Floor</h3>
<span class="font-body-md text-body-md text-on-surface-variant tracking-wider font-medium">Collaborative Spaces</span>
</div>
<div class="bg-black text-white px-sm py-xs rounded-full flex items-center gap-xs border-2 border-black">
<span class="font-label-lg text-label-lg font-bold tracking-widest">85% occupied</span>
</div>
</div>
<div class="w-full bg-white rounded-full h-[8px] mt-sm border-2 border-black overflow-hidden">
<div class="bg-error h-full rounded-full" style="width: 85%"></div>
</div>
</div>
<!-- Second Floor Card -->
<div class="bg-neo-bg rounded-[12px] p-md shadow-[4px_4px_0px_rgba(0,0,0,1)] border-[1px] border-neo-border flex flex-col gap-sm cursor-pointer hover:-translate-y-1 hover:shadow-[6px_6px_0px_rgba(0,0,0,1)] transition-all active:scale-[0.98] duration-150 group">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<h3 class="font-headline-md text-headline-md text-on-surface tracking-widest uppercase">Second Floor</h3>
<span class="font-body-md text-body-md text-on-surface-variant tracking-wider font-medium">Postgrad &amp; Journals</span>
</div>
<div class="bg-black text-white px-sm py-xs rounded-full flex items-center gap-xs border-2 border-black">
<span class="font-label-lg text-label-lg font-bold tracking-widest">32% occupied</span>
</div>
</div>
<div class="w-full bg-white rounded-full h-[8px] mt-sm border-2 border-black overflow-hidden">
<div class="bg-tertiary-fixed-dim h-full rounded-full" style="width: 32%"></div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-white border-t-2 border-black shadow-[0_-4px_0_rgba(0,0,0,1)]">
<div class="fixed bottom-0 left-0 right-0 flex justify-around items-center px-4 py-3 max-w-[375px] mx-auto bg-white">
<!-- Floors (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-white rounded-full px-6 py-2 border-2 border-black shadow-[2px_2px_0px_rgba(0,0,0,1)] active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">layers</span>
<span class="font-label-sm text-label-sm mt-1 font-bold tracking-widest uppercase">Floors</span>
</a>
<!-- My Seats (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high transition-all rounded-full px-4 py-2 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined text-[24px]">event_seat</span>
<span class="font-label-sm text-label-sm mt-1 tracking-widest uppercase">My Seats</span>
</a>
<!-- Account (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface hover:bg-surface-container-high transition-all rounded-full px-4 py-2 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined text-[24px]">person</span>
<span class="font-label-sm text-label-sm mt-1 tracking-widest uppercase">Account</span>
</a>
</div>
</nav>
</body></html>
