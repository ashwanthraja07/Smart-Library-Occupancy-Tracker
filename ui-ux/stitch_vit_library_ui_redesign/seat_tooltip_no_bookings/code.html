<body class="flex items-end justify-center min-h-screen font-body-md text-on-surface">
<!-- Bottom Sheet -->

<!-- Drag Handle Area -->

<div class="w-12 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-mobile pb-md">
<!-- Header Section -->
<div class="flex items-center justify-between mb-md">

<!-- Badge -->

          Silent Zone
        </span>
</div>
<!-- Comfort Score Section -->

</div>
<!-- Progress Bar -->

<div class="h-full bg-secondary-container border-r border-on-surface w-[80%]"></div>
</div>

<!-- Amenities Section -->
<div class="grid grid-cols-3 gap-sm border-t border-on-surface pt-sm mt-md">
<!-- Amenity 1 -->
<div class="flex flex-col items-center justify-center p-sm border border-on-surface bg-surface-container-lowest">
<span aria-hidden="true" class="material-symbols-outlined text-[32px] text-on-surface mb-xs" data-icon="power">power</span>
<span class="font-label-sm text-label-sm text-on-surface">Power outlet</span>
<span class="font-label-lg text-label-lg text-primary mt-1">Yes</span>
</div>
<!-- Amenity 2 -->
<div class="flex flex-col items-center justify-center p-sm border border-on-surface bg-surface-container-lowest">
<span aria-hidden="true" class="material-symbols-outlined text-[32px] text-on-surface mb-xs" data-icon="ac_unit">ac_unit</span>
<span class="font-label-sm text-label-sm text-on-surface">AC</span>
<span class="font-label-lg text-label-lg text-primary mt-1">Yes</span>
</div>
<!-- Amenity 3 -->
<div class="flex flex-col items-center justify-center p-sm border border-on-surface bg-surface-container-high">
<span aria-hidden="true" class="material-symbols-outlined text-[32px] text-on-surface-variant mb-xs" data-icon="desktop_windows">desktop_windows</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Window seat</span>
<span class="font-label-lg text-label-lg text-on-surface-variant mt-1">No</span>
</div>
</div>
</div>
</div>
<script>
    // Simple visual interaction for drag handle to feel responsive
    const sheet = document.getElementById('bottom-sheet');
    const handle = document.getElementById('drag-handle');
    let startY = 0;

    handle.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      sheet.style.transition = 'none';
    }, {passive: true});

    handle.addEventListener('touchmove', (e) => {
      const currentY = e.touches[0].clientY;
      const diff = currentY - startY;
      if (diff > 0) {
        sheet.style.transform = `translateY(${diff}px)`;
      }
    }, {passive: true});

    handle.addEventListener('touchend', (e) => {
      sheet.style.transition = 'transform 0.3s ease-out';
      sheet.style.transform = `translateY(0px)`;
    }, {passive: true});
  </script>
